services:
  backend:
    build: ./backend
    environment:
      
      DATA_FILE: /app/data/notes.json
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - notes-data:/app/data
    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /backend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: notesdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  notes-data:
  postgres-data: